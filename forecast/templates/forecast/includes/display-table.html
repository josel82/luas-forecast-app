{% load static %}

<table id="luas-table">
    <thead>
        <tr><th>Direction</th><th>Destination</th><th>Due (mins)</th></tr>
    </thead>
    <tbody>
    {% for a in arrivals %}
        <tr>
            <td>{{ a.direction }}</td>
            <td>{{ a.destination }}</td>
            <td>{{ a.due_mins }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
<p id="last-updated">Last updated: {{ arrivals.0.timestamp|date:"H:i:s" }}</p>
